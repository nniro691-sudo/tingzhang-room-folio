    <title>张婷早期作品集 · Archive Portfolio</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #050607;
            --surface: #f5f7ee;
            --muted: rgba(245, 247, 238, .66);
            --accent: #c7ff4b;
            --line: rgba(255, 255, 255, .12);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at 50% 0%, rgba(199, 255, 75, .16), transparent 34rem),
                linear-gradient(180deg, #070a09 0%, var(--bg) 42%, #020302 100%);
            color: var(--surface);
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 18px clamp(18px, 4vw, 56px);
            background: rgba(5, 6, 7, .72);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(18px);
        }
        .brand { font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        a { color: inherit; text-decoration: none; }
        .btn {
            display: inline-flex;
            align-items: center;
            min-height: 38px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .06);
            font-size: 13px;
            font-weight: 800;
        }
        .btn.primary { background: var(--accent); color: #050607; border-color: var(--accent); }
        main { width: min(1120px, calc(100vw - 28px)); margin: 0 auto; padding: clamp(36px, 8vw, 90px) 0 80px; }
        .hero { margin-bottom: 30px; }
        .eyebrow { color: var(--accent); font-size: 12px; font-weight: 900; letter-spacing: .22em; text-transform: uppercase; }
        h1 { margin: 12px 0 10px; font-size: clamp(36px, 8vw, 92px); line-height: .9; letter-spacing: -.04em; }
        .desc { max-width: 760px; color: var(--muted); line-height: 1.8; font-size: 15px; }
        .pages { display: grid; gap: clamp(18px, 3vw, 34px); }
        .page {
            margin: 0;
            overflow: hidden;
            border-radius: clamp(18px, 2.4vw, 30px);
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .035);
            box-shadow: 0 30px 90px rgba(0, 0, 0, .45);
        }
        .page img { display: block; width: 100%; height: auto; background: #111; }
        .page-caption {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: 12px 16px;
            color: rgba(245, 247, 238, .58);
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        @media (max-width: 640px) {
            html,
            body { overflow-x: hidden; }
            .topbar {
                align-items: flex-start;
                padding: 14px 14px;
            }
            .brand {
                font-size: 13px;
                padding-top: 10px;
            }
            .actions {
                gap: 8px;
            }
            .btn {
                min-height: 34px;
                padding: 0 12px;
                font-size: 12px;
            }
            main {
                width: min(100% - 20px, 1120px);
                padding-bottom: 52px;
            }
            h1 {
                font-size: clamp(36px, 14vw, 58px);
            }
            .desc {
                font-size: 14px;
                line-height: 1.75;
            }
            .pages {
                gap: 16px;
            }
            .page-caption {
                padding: 10px 12px;
                font-size: 10px;
            }
        }
    </style>
